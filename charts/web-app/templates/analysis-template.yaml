apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: web-app-e2e
spec:
  metrics:
    - name: e2e-tests-smoke
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: e2e-smoke
                    image: chaossnowflake/web-app-tests:1.0.3
                    imagePullPolicy: IfNotPresent
                    args: ["test", "-Dapp.host=http://web-app-preview", "-Dapp.runType=smoke", "-DisFail=true"]
    - name: e2e-tests-regression
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: e2e-regression
                    image: chaossnowflake/web-app-tests:1.0.3
                    imagePullPolicy: IfNotPresent
                    args: ["test", "-Dapp.host=http://web-app-preview", "-Dapp.runType=regression"]
