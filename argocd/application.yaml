apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector
  source:
    repoURL: https://github.com/AntonDesilvaProjects/web-app-deploy.git
    targetRevision: main
    path: charts/web-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: web-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
